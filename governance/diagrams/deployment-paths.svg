<svg viewBox="0 0 1120 994" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Deployment paths from the shared constitution</title>
  <desc id="description">Editorial review produces two authored contract bodies. A deterministic script distributes the chat body into three adapters and the execution body into four agent guides. Grok and OpenCode reference the execution source directly. Full-core sessions receive constitution files directly. Cowork requires either the core constitution or chat body together with its addendum. Voice craft is supplied separately at execution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6F6E68" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1120" height="994" fill="#fafaf8" rx="10"/>
  <text x="560" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#2C2C2A">Deployment Paths</text>
  <text x="560" y="60" text-anchor="middle" font-size="13" fill="#6F6E68">One policy source · two authored derivations · delivery through the actual host</text>

  <rect x="292" y="88" width="536" height="92" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="560" y="115" text-anchor="middle" font-size="17" font-weight="600" fill="#085041">Constitution · source of truth</text>
  <text x="560" y="139" text-anchor="middle" font-size="13" fill="#0F6E56">kit/constitution/ · bootstrap, calibration, operating contract</text>
  <text x="560" y="162" text-anchor="middle" font-size="12" fill="#0F6E56">Professional overlay supplied only when relevant</text>

  <path d="M560 180 V210 H293 V246" fill="none" stroke="#6F6E68" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M560 210 H827 V246" fill="none" stroke="#6F6E68" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="560" y="234" text-anchor="middle" font-size="12" fill="#6F6E68">Reviewed condensation + coverage map</text>

  <rect x="48" y="250" width="490" height="104" rx="8" fill="#FAECE7" stroke="#993C1D"/>
  <text x="72" y="277" font-size="11" font-weight="600" fill="#993C1D">AUTHORED CHAT BODY</text>
  <text x="72" y="303" font-size="18" font-weight="600" fill="#712B13">chat-contract.md</text>
  <text x="72" y="330" font-size="13" fill="#993C1D">Standalone conversational baseline</text>

  <rect x="582" y="250" width="490" height="104" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="606" y="277" font-size="11" font-weight="600" fill="#185FA5">AUTHORED EXECUTION BODY</text>
  <text x="606" y="303" font-size="18" font-weight="600" fill="#0C447C">execution-contract.md</text>
  <text x="606" y="330" font-size="13" fill="#185FA5">Standalone task baseline; supplied with a task handover</text>

  <line x1="293" y1="354" x2="293" y2="386" stroke="#6F6E68" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="827" y1="354" x2="827" y2="386" stroke="#6F6E68" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="48" y="390" width="1024" height="72" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="560" y="418" text-anchor="middle" font-size="16" font-weight="600" fill="#444441">sync_contracts.py · deterministic distribution</text>
  <text x="560" y="443" text-anchor="middle" font-size="13" fill="#5F5E5A">Copies marked bodies and metadata; product wrappers remain manually maintained</text>

  <line x1="293" y1="462" x2="293" y2="494" stroke="#6F6E68" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="827" y1="462" x2="827" y2="494" stroke="#6F6E68" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="48" y="498" width="490" height="132" rx="8" fill="#fff" stroke="#993C1D"/>
  <text x="72" y="525" font-size="11" font-weight="600" fill="#993C1D">3 GENERATED CHAT COPIES</text>
  <text x="72" y="553" font-size="15" font-weight="500" fill="#712B13">Claude preferences</text>
  <text x="72" y="578" font-size="15" font-weight="500" fill="#712B13">ChatGPT custom instructions</text>
  <text x="72" y="603" font-size="15" font-weight="500" fill="#712B13">Gemini saved instructions</text>

  <rect x="582" y="498" width="490" height="132" rx="8" fill="#fff" stroke="#185FA5"/>
  <text x="606" y="525" font-size="11" font-weight="600" fill="#185FA5">4 GENERATED AGENT-GUIDE COPIES</text>
  <text x="606" y="554" font-size="15" font-weight="500" fill="#0C447C">Codex · Claude Code</text>
  <text x="606" y="580" font-size="15" font-weight="500" fill="#0C447C">Copilot CLI · Hermes</text>
  <text x="606" y="608" font-size="12" fill="#185FA5">Guide bodies are copied; host configuration is a separate action</text>

  <text x="72" y="659" font-size="12" fill="#6F6E68">Copy parity checks distribution only.</text>
  <text x="72" y="680" font-size="12" fill="#6F6E68">Coverage, deployment and adherence need separate evidence.</text>
  <path d="M1072 302 H1094 V672 H1076" fill="none" stroke="#6F6E68" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="582" y="650" width="490" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-dasharray="5 4"/>
  <text x="606" y="672" font-size="14" font-weight="600" fill="#0C447C">Grok / OpenCode · reference the execution source directly</text>
  <text x="606" y="691" font-size="12" fill="#185FA5">Direct-source route; no additional generated copies</text>

  <rect x="48" y="734" width="1024" height="124" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="72" y="760" font-size="12" font-weight="600" fill="#534AB7">COWORK · REQUIRED LOADING COMBINATION</text>
  <rect x="72" y="778" width="324" height="58" rx="5" fill="#fff" stroke="#534AB7" stroke-width="0.6"/>
  <text x="234" y="802" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Core constitution OR chat body</text>
  <text x="234" y="823" text-anchor="middle" font-size="12" fill="#534AB7">The shared operating base</text>
  <text x="421" y="814" text-anchor="middle" font-size="24" fill="#534AB7">+</text>
  <rect x="446" y="778" width="270" height="58" rx="5" fill="#fff" stroke="#534AB7" stroke-width="0.6"/>
  <text x="581" y="802" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Cowork addendum</text>
  <text x="581" y="823" text-anchor="middle" font-size="12" fill="#534AB7">Additional action and output safeguards</text>
  <line x1="732" y1="807" x2="772" y2="807" stroke="#6F6E68" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="910" y="801" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Cowork session</text>
  <text x="910" y="824" text-anchor="middle" font-size="12" fill="#534AB7">Verify that the base is supplied</text>

  <rect x="48" y="888" width="1024" height="78" rx="8" fill="#fff" stroke="#D3D1C7"/>
  <text x="72" y="912" font-size="13" fill="#444441">Full-core sessions receive constitution files directly; derived bodies defer within the host hierarchy.</text>
  <text x="72" y="934" font-size="13" fill="#444441">my-voice is supplied separately for relevant execution; model guidance stays a maintenance reference.</text>
  <text x="72" y="956" font-size="12" fill="#6F6E68">These are intended delivery paths. Saved state, runtime loading and adherence are distinct verification steps.</text>
</svg>
