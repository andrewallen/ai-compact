<svg viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Work flowing between exploration, execution and refinement</title>
  <desc id="desc">The request and preceding context select the mode on any product. Exploration offers frames and unfinished sketches. An explicit request to develop or produce moves to execution. A request to revise existing content selects refinement, preserving meaning and ownership. A defined task can enter execution directly. Reopening the inquiry is a deliberate transition; a side question does not cancel active work. Scope, attribution and approval boundaries persist across modes and surfaces.</desc>
  <rect width="1100" height="640" rx="12" fill="#fafaf8"/>
  <text x="36" y="48" font-size="27" font-weight="700" fill="#242b29">Work flowing between modes</text>
  <text x="36" y="78" font-size="16" fill="#58645f">The request and preceding context select the mode, on any product.</text>
  <rect x="36" y="98" width="1028" height="40" rx="6" fill="#eef0eb"/>
  <text x="55" y="124" font-size="15" fill="#35433b">Enter where the work calls for it: a defined task can begin directly in execution.</text>

  <rect x="36" y="168" width="296" height="262" rx="10" fill="#e1f2e9" stroke="#297357"/>
  <text x="57" y="205" font-size="23" font-weight="700" fill="#18513d">Exploration</text>
  <text x="57" y="232" font-size="14" fill="#297357">Develop a view</text>
  <line x1="57" y1="251" x2="311" y2="251" stroke="#a6cbb8"/>
  <g font-size="16" fill="#244b3a">
    <text x="57" y="281">Apply lenses and test assumptions.</text>
    <text x="57" y="309">Offer unfinished sketches</text>
    <text x="57" y="332">for reaction.</text>
    <text x="57" y="373" font-weight="700">Selecting a sketch does not</text>
    <text x="57" y="396" font-weight="700">request the finished piece.</text>
  </g>

  <rect x="402" y="168" width="296" height="262" rx="10" fill="#e6eff9" stroke="#376b9e"/>
  <text x="423" y="205" font-size="23" font-weight="700" fill="#244b78">Execution</text>
  <text x="423" y="232" font-size="14" fill="#376b9e">Complete requested work</text>
  <line x1="423" y1="251" x2="677" y2="251" stroke="#b0c6de"/>
  <g font-size="16" fill="#284a70">
    <text x="423" y="281">Use the brief and prior decisions.</text>
    <text x="423" y="309">Carry the analysis far enough</text>
    <text x="423" y="332">to deliver and verify the result.</text>
    <text x="423" y="373" font-weight="700">Keep the agreed objective</text>
    <text x="423" y="396" font-weight="700">through corrections and questions.</text>
  </g>

  <rect x="768" y="168" width="296" height="262" rx="10" fill="#f7eddf" stroke="#946226"/>
  <text x="789" y="205" font-size="23" font-weight="700" fill="#78501f">Refinement</text>
  <text x="789" y="232" font-size="14" fill="#946226">Sharpen existing content</text>
  <line x1="789" y1="251" x2="1043" y2="251" stroke="#dcc2a0"/>
  <g font-size="16" fill="#694b29">
    <text x="789" y="281">Preserve meaning, stance</text>
    <text x="789" y="304">and first-person ownership.</text>
    <text x="789" y="337">Explain any necessary rebuild.</text>
    <text x="789" y="373" font-weight="700">Flag a semantic change before</text>
    <text x="789" y="396" font-weight="700">applying it, unless requested.</text>
  </g>

  <line x1="340" y1="320" x2="388" y2="320" stroke="#626760" stroke-width="1.6"/>
  <polygon points="388,315 395,320 388,325" fill="#626760"/>
  <line x1="706" y1="320" x2="754" y2="320" stroke="#626760" stroke-width="1.6"/>
  <polygon points="754,315 761,320 754,325" fill="#626760"/>
  <line x1="916" y1="430" x2="916" y2="475" stroke="#626760" stroke-width="1.6"/>
  <line x1="916" y1="475" x2="184" y2="475" stroke="#626760" stroke-width="1.6"/>
  <line x1="184" y1="475" x2="184" y2="438" stroke="#626760" stroke-width="1.6"/>
  <polygon points="179,438 184,431 189,438" fill="#626760"/>
  <g text-anchor="middle" font-size="12" fill="#4c5951">
    <text x="367" y="272">Request</text>
    <text x="367" y="289">developed</text>
    <text x="367" y="306">output</text>
    <text x="733" y="272">Request</text>
    <text x="733" y="289">a revision</text>
  </g>
  <rect x="240" y="461" width="620" height="28" rx="5" fill="#fafaf8"/>
  <text x="550" y="480" text-anchor="middle" font-size="15" fill="#4c5951">Reopen the inquiry when requested; this is not a fixed sequence.</text>

  <rect x="36" y="516" width="1028" height="96" rx="8" fill="#fff" stroke="#d0d6ce"/>
  <text x="57" y="545" font-size="16" font-weight="700" fill="#35433b">Across every mode and surface</text>
  <text x="57" y="573" font-size="15" fill="#4c5951">Carry forward context, rationale and attribution. Preserve the approved scope and narrower safeguards.</text>
  <text x="57" y="597" font-size="15" fill="#4c5951">A request for an answer does not itself approve a persistent change or external action.</text>
</svg>
